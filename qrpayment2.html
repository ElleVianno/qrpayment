<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e0f7e9, #f4f4f4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .success-container {
      width: 92%;
      max-width: 380px;
      background-color: white;
      padding: 40px 25px;   /* lebih panjang */
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      animation: fadeIn 0.6s ease-in-out;
      min-height: 480px;   /* bagi tinggi tetap sikit */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Success icon animation */
    .success-icon {
      width: 100px;
      height: 100px;
      background-color: #4CAF50;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: popIn 0.5s ease;
    }

    .success-icon:before {
      content: '✔';
      font-size: 50px;
      color: white;
    }

    h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
      color: #222;
      margin-bottom: 20px;
    }

    .company-name {
      font-size: 18px;
      font-weight: bold;
      color: #4CAF50;
      margin-bottom: 25px;
    }

    .transaction-details {
      text-align: left;
      font-size: 15px;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 10px;
    }

    .transaction-details span {
      font-weight: bold;
      color: #333;
    }

    .done-btn {
      background: #4CAF50;
      color: white;
      padding: 16px 0;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s ease;
    }

    .done-btn:hover {
      background: #43a047;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div>
      <div class="success-icon"></div>
      <h2>Payment Successful</h2>
      <div class="amount">RM <span id="paymentAmount">0.00</span></div>
      <div class="company-name">KV PARADISE SDN.BHD</div>

      <div class="transaction-details">
        <p>Reference ID: <span id="referenceId">81892704</span></p>
        <p id="dateTime">Date & Time: 1 Sep 2024, 12:35 pm</p>
        <p>Transaction Type: <span>Scan & Pay</span></p>
      </div>
    </div>

    <button class="done-btn" onclick="goToNext()">Done</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let amount = localStorage.getItem('paymentAmount') || '0.00';
      document.getElementById('paymentAmount').textContent = amount;

      // Auto-generate Date & Time
      let now = new Date();
      let options = {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: 'numeric', minute: 'numeric', hour12: true
      };
      let formattedDate = now.toLocaleDateString('en-MY', options).replace(',', '');
      document.getElementById('dateTime').textContent = `Date & Time: ${formattedDate}`;

      // Random Reference ID
      document.getElementById('referenceId').textContent =
        Math.floor(10000000 + Math.random() * 90000000);
    });

    function goToNext() {
      window.location.href = 'nextpage.html';
    }
  </script>

</body>
</html>
