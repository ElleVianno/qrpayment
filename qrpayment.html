<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Payment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #e0f7e9, #f4f4f4);
    }

    .font-container {
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      padding: 25px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 18px;
      font-weight: 600;
      color: #2e7d32; /* hijau gelap */
    }

    .amount-input {
      display: flex;
      justify-content: center;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .currency {
      font-size: 22px;
      opacity: 0.8;
      font-weight: bold;
      color: #388e3c;
    }

    .amount {
      font-size: 34px;
      opacity: 0.9;
      margin-left: 5px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #2e7d32;
    }

    .underline {
      font-size: 20px;
      color: #bbb;
      margin-bottom: 20px;
    }

    .keypad {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      flex: 1;
      max-width: 85px;
      height: 65px;
      font-size: 18px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      background: #f5f5f5;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: all 0.2s ease-in-out;
    }

    button:hover {
      transform: scale(1.05);
      background-color: #e0e0e0;
    }

    .delete {
      background: #e53935;
      color: #fff;
      font-weight: 600;
    }

    .confirm {
      background: #4CAF50;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
    }

    /* Loading animation styles */
    .loading-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }

    .loading-container.show {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top: 5px solid #fff;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    .loading-text {
      animation: blink 1.5s infinite;
      letter-spacing: 1px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media screen and (max-width: 480px) {
      .font-container {
        max-width: 92%;
        padding: 20px;
      }

      button {
        height: 60px;
        font-size: 16px;
      }

      h2 {
        font-size: 18px;
      }

      .currency { font-size: 20px; }
      .amount { font-size: 30px; }
    }
  </style>
</head>
<body>

  <div class="font-container">
    <h2>Enter Amount</h2>
    <div class="amount-input">
      <span class="currency">RM</span>
      <span id="amount" class="amount">0.00</span>
    </div>
    <div class="underline">_______________________</div>
    
    <div class="keypad">
      <div class="row">
        <button onclick="addNumber(1)">1</button>
        <button onclick="addNumber(2)">2</button>
        <button onclick="addNumber(3)">3</button>
      </div>
      <div class="row">
        <button onclick="addNumber(4)">4</button>
        <button onclick="addNumber(5)">5</button>
        <button onclick="addNumber(6)">6</button>
      </div>
      <div class="row">
        <button onclick="addNumber(7)">7</button>
        <button onclick="addNumber(8)">8</button>
        <button onclick="addNumber(9)">9</button>
      </div>
      <div class="row">
        <button class="delete" onclick="deleteNumber()">⌫</button>
        <button onclick="addNumber(0)">0</button>
        <button class="confirm" onclick="confirmPayment()">✔</button>
      </div>
    </div>
  </div>

  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Sila Tunggu...</div>
  </div>

  <script>
    let currentAmount = '';
  
    function addNumber(num) {
      if (currentAmount.length < 9) {
        currentAmount += num.toString();
        updateDisplay();
      }
    }
  
    function updateDisplay() {
      const displayAmount = document.getElementById('amount');
      if (currentAmount === '') {
        displayAmount.textContent = '0.00';
      } else {
        let amountWithDecimal = (currentAmount / 100).toFixed(2);
        displayAmount.textContent = amountWithDecimal;
      }
    }
  
    function deleteNumber() {
      currentAmount = currentAmount.slice(0, -1);
      updateDisplay();
    }
  
    function confirmPayment() {
      localStorage.setItem('paymentAmount', (currentAmount / 100).toFixed(2));
      const loading = document.getElementById('loading');
      loading.classList.add('show');
      setTimeout(() => {
        window.location.href = "qrpayment1.html"; 
      }, 2500);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').then(() => {
          console.log('Service Worker Registered');
        });
      });
    }
  </script>
</body>
</html>
