<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Payment Confirmation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f7e9, #f4f4f4);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .payment-container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      padding: 45px 28px;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 28px;
    }

    .profile-pic {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      overflow: hidden;
      border: 4px solid #4CAF50;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .company-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #2e7d32;
    }

    .amount {
      font-size: 34px;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 32px;
    }

    .account-container {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 12px;
      font-size: 15px;
      color: #555;
      margin-bottom: 38px;
      line-height: 1.7;
    }

    .account-number {
      font-size: 18px;
      letter-spacing: 2px;
      font-weight: 600;
      color: #333;
      margin-top: 10px;
    }

    .pay-now-btn {
      background: linear-gradient(135deg, #00c853, #4caf50);
      color: #fff;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: 0.25s;
      box-shadow: 0 6px 15px rgba(0, 200, 83, 0.4);
    }

    .pay-now-btn:hover {
      background: linear-gradient(135deg, #00b248, #43a047);
    }

    /* Loading animation styles */
    .loading-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }

    .loading-container.show {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid #4CAF50;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      animation: blink 1.5s infinite;
      letter-spacing: 1px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="payment-container">
    <h2>Scan & Pay</h2>
    <div class="profile-pic">
      <img src="your-image.jpg" alt="Profile Picture">
    </div>
    <div class="company-name">KV PARADISE SDN. BHD</div>
    <div class="amount">RM <span id="paymentAmount">0.00</span></div>
    <div class="account-container">
      <div class="account-info">Company Saver Account</div>
      <div class="account-number">**** **** **** 1867</div>
    </div>
    <button class="pay-now-btn" onclick="proceedToNext()">Pay Now</button>
  </div>

  <!-- Loading overlay -->
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Sila Tunggu...</div>
  </div>

  <audio id="paymentSound" src="your-sound-file.mp3" preload="auto"></audio>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let amount = localStorage.getItem('paymentAmount') || '0.00';
      document.getElementById('paymentAmount').textContent = amount;
    });

    function proceedToNext() {
      const loading = document.getElementById('loading');
      loading.classList.add('show');

      const paymentSound = document.getElementById('paymentSound');
      paymentSound.play();

      setTimeout(() => {
        window.location.href = 'qrpay2.html';
      }, 3000);
    }
  </script>

</body>
</html>
